<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Brokered credentials pattern</title>
<desc>The LLM only sends a tool call instruction to a credential broker, which holds the per-user OAuth token and calls the SaaS API on the user's behalf. The token never enters the model's context.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
.ts { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #5F5E5A; }
</style>
</defs>

<rect x="40" y="60" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="120" y="84" text-anchor="middle" dominant-baseline="central" fill="#3C3489">LLM</text>
<text class="ts" x="120" y="102" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Never sees the token</text>

<rect x="260" y="60" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="84" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Credential broker</text>
<text class="ts" x="340" y="102" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Holds per-user tokens</text>

<rect x="480" y="60" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="560" y="84" text-anchor="middle" dominant-baseline="central" fill="#085041">SaaS API</text>
<text class="ts" x="560" y="102" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Validates token</text>

<line x1="200" y1="88" x2="252" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="226" y="78" text-anchor="middle">tool call</text>

<line x1="420" y1="88" x2="472" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="446" y="78" text-anchor="middle">authed call</text>

<line x1="472" y1="100" x2="420" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="446" y="118" text-anchor="middle">result</text>

<line x1="252" y1="100" x2="200" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="226" y="118" text-anchor="middle">result</text>

<rect x="180" y="200" width="320" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Why this matters</text>
<text class="ts" x="340" y="248" text-anchor="middle" dominant-baseline="central" fill="#444441">A prompt injection cannot exfiltrate</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central" fill="#444441">a token the model never had access to</text>
</svg>
