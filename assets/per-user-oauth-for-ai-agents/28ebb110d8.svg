<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Multi-tenant token isolation</title>
<desc>Three users each with their own scoped, encrypted token store, all routed through a single agent runtime that loads the correct user's credentials per request.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
.ts { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #5F5E5A; }
</style>
</defs>

<rect x="260" y="40" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="64" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Agent runtime</text>
<text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Same code for all users</text>

<line x1="320" y1="96" x2="140" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="96" x2="540" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="180" width="200" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="140" y="210" text-anchor="middle" dominant-baseline="central" fill="#085041">User A</text>
<text class="ts" x="140" y="232" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Encrypted token bucket</text>

<rect x="260" y="180" width="160" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="210" text-anchor="middle" dominant-baseline="central" fill="#085041">User B</text>
<text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Encrypted token bucket</text>

<rect x="440" y="180" width="200" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="540" y="210" text-anchor="middle" dominant-baseline="central" fill="#085041">User C</text>
<text class="ts" x="540" y="232" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Encrypted token bucket</text>

<rect x="120" y="300" width="440" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central" fill="#444441">Revoking one user's grant does not affect the others</text>
</svg>
